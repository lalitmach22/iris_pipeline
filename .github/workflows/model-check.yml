name: Model Sanity Check

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt          
          pip install dvc

      - name: Set up GCP credentials and authenticate
        env:
          GCP_B64: ${{ secrets.GCP_CREDENTIALS_B64 }}
        run: |
          set -e
          echo "$GCP_B64" | base64 -d > gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json" >> $GITHUB_ENV
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json
          
          echo "✓ Decoded service account key"
          python3 -m json.tool gcp-key.json > /dev/null && echo "✓ Valid JSON"
          
          echo "Installing Google Cloud CLI..."
          sudo apt-get update && sudo apt-get install -y google-cloud-cli
          
          echo "Authenticating with GCP..."
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project mlopsweek1
          
          echo "Setting up application default credentials..."
          gcloud auth application-default print-access-token > /dev/null 2>&1 || \
          GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json gcloud auth application-default login --no-launch-browser --quiet || true
          
          echo "Testing GCS access:"
          gsutil ls gs://week4_mlops_bucket/ || echo "Warning: Bucket check failed"
          
          echo "Running DVC pull in same session..."
          source .venv/bin/activate
          
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json
          export GOOGLE_CLOUD_PROJECT=mlopsweek1
          export GCLOUD_PROJECT=mlopsweek1
          
          echo "Configuring DVC to use gcloud credentials..."
          dvc remote modify gcsremote credentialpath $(pwd)/gcp-key.json
          
          echo "Running DVC pull:"
          dvc pull -v

      ### NEW STEP ###
      - name: Data Quality Check
        id: label_check
        run: |
          source .venv/bin/activate
          echo "## Data Quality Report" >> report.md
          # Run the check and save the output to the report file
          python src/check_labels.py --data-path data/iris.csv >> report.md
          
          # Extract the number of suspicious labels to use in the next step
          SUSPICIOUS_COUNT=$(grep "Found" report.md | awk '{print $2}')
          echo "Suspicious labels found: $SUSPICIOUS_COUNT"
          echo "count=$SUSPICIOUS_COUNT" >> "$GITHUB_OUTPUT"

      ### NEW STEP ###
      - name: Validate Label Quality
        run: |
          echo "Checking if suspicious count is within tolerance..."
          # The baseline on clean data is ~3. Let's set a threshold of 10.
          # If more than 10 suspicious labels are found, fail the workflow.
          if [ ${{ steps.label_check.outputs.count }} -gt 10 ]; then
            echo "Error: High number of suspicious labels detected (${{ steps.label_check.outputs.count }}). Aborting workflow."
            exit 1
          else
            echo "Data quality check passed. Proceeding with training."
          fi

      - name: Auto-format with Black
        run: |
          source .venv/bin/activate
          echo "## Code Formatting (Black)" >> report.md
          black --check --diff src/ tests/ >> report.md 2>&1 || echo "Formatting issues found" >> report.md
          echo "" >> report.md

      - name: Lint with Flake8
        run: |
          source .venv/bin/activate
          echo "## Linting Results (Flake8)" >> report.md
          flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503 >> report.md 2>&1 || echo "Linting issues found" >> report.md
          echo "" >> report.md

      - name: Run training
        run: |
          source .venv/bin/activate
          python src/train.py

      - name: Run evaluation
        run: |
          source .venv/bin/activate
          python src/evaluate.py

      - name: Generate model performance metrics
        run: |
          source .venv/bin/activate
          python src/plot_metrics.py
          echo "## Model Performance Metrics" >> report.md
          # Note: The plot is now in the artifacts directory
          echo "![Model Metrics](./artifacts/metrics.png)" >> report.md
          echo "" >> report.md

      - name: Run tests and save report
        run: |
          source .venv/bin/activate
          echo "## Test Results" >> report.md
          pytest --tb=short --disable-warnings >> report.md 2>&1 || echo "Tests failed" >> report.md
          echo "Tests completed on $(date)" >> report.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/
            report.md

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Comment test results with CML
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .venv/bin/activate
          cml comment create report.md
